version: '3.8'

services:
  aegis-agent:
    build: .
    container_name: aegis_financial_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./run_advisory.py:/app/run_advisory.py
      - ./tests:/app/tests
    environment:
      - TZ=Asia/Kolkata
    command: python main.py
